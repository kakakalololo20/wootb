name: Woot keywords
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: woot-keywords

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright requests
      - run: playwright install --with-deps chromium
      - run: python bot2.py
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
      - name: Save seen file
        if: success()
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen_keywords.json
          git diff --staged --quiet || (git commit -m "update keywords seen" && git pull --rebase && git push)
