name: Woot check

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: woot-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run Woot monitor
        env:
          BOT_CHANNEL: github
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python bot.py

      - name: Save GitHub failure status
        if: always()
        run: |
          if [ -f status_github.json ]; then
            git config user.name "Woot Monitor Bot"
            git config user.email "woot-monitor@users.noreply.github.com"
            git add status_github.json

            if ! git diff --cached --quiet; then
              git commit -m "Update GitHub monitor status"
              git fetch origin main
              git rebase origin/main
              git push origin HEAD:main
            fi
          fi
